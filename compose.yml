services:
  project-zomboid:
    image: cm2network/steamcmd 
    entrypoint: "bash"
    command: [
      "/opt/server/start-server.sh",
      "-servername",    "${SERVER_NAME:-MyWorld}",
      "-adminpassword", "${ADMIN_PASSWORD?Admin password required, edit the `.env` file}",
      "-adminusername", "${ADMIN_USERNAME:-admin}" 
    ]
    environment:
      JAVA_TOOL_OPTIONS: "${JVM_MIN_MEMORY:+-Xms$JVM_MIN_MEMORY} ${JVM_MAX_MEMORY:+-Xmx$JVM_MAX_MEMORY}"
    volumes:
      - ${SERVER_PATH:-./server}:/opt/server
      - ${DATA_PATH:-./data}:/home/steam/Zomboid
    ports:
      - ${SERVER_PORT:-16261}:16261/udp
    configs:
      - steamcmd-script

configs:
  # The steamcmd script used to initally install, and to update the game server
  #   https://developer.valvesoftware.com/wiki/SteamCMD#Creating_a_Script
  steamcmd-script:
    content: |
      @ShutdownOnFailedCommand 1
      @NoPromptForPassword 1
      force_install_dir /opt/server/

      login anonymous
      app_update 380870 validate
      quit
